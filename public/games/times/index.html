<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ Batalha de Times - Brasileirão</title>
  <link rel="stylesheet" href="teams.css" />
</head>
<body>
  <div id="teams-container">
    <div id="teams-header">
      <h1>🏆 Copa TikTok</h1>
      <div id="timer">05:00</div>
    </div>

    <div id="teams-scoreboard"></div>

    <div id="instructions">
      <h3>COMO JOGAR:</h3>
      <p>1️⃣ <strong>COMENTE</strong> o nome do seu time para entrar na torcida.</p>
      <p>2️⃣ Floodar o chat dá <strong>PRESSÃO</strong> (Gols demorados).</p>
      <p>3️⃣ Mandar <strong>PRESENTES</strong> dá <strong>GOL DIRETO</strong> (Obrigatório comentar o time antes!)</p>
      <p id="status">Aguardando conexão...</p>
    </div>
  </div>

  <script src="teams.js"></script>
</body>
</html>
